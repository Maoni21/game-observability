groups:
  - name: game-telemetry-red
    rules:
      - record: job:http_requests:rate5m
        expr: sum by (job, route) (rate(http_requests_total[5m]))

      - record: job:http_errors:ratio5m
        expr: |
          sum by (job, route) (rate(http_requests_total{status=~"5.."}[5m]))
          /
          sum by (job, route) (rate(http_requests_total[5m]))

      - record: job:http_request_duration_seconds:p95_5m
        expr: |
          histogram_quantile(0.95,
            sum by (job, route, le) (rate(http_request_duration_seconds_bucket[5m])))

  - name: game-telemetry-jeu
    rules:
      - record: build_reason:perf_reports:rate5m
        expr: sum by (build, reason) (rate(perf_reports_total[5m]))